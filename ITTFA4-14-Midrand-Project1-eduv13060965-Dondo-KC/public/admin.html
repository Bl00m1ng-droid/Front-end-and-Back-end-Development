<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Haven</title>
    <!--link to font awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
    <!--link to css-->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="headerplaceholder"></header>

  <main class="container">
    <!-- Dashboard Section -->
    <section class="admin-section">

  <h1 class="section-title">
    <i class="fas fa-chart-line"></i>
    Admin Dashboard
  </h1>

  <!-- KPI Cards -->
  <div class="stats-grid">

    <div class="admin-card stat-card">
      <i class="fas fa-book"></i>
      <div>
        <h3>Total Books</h3>
        <p id="totalBooks">0</p>
      </div>
    </div>

    <div class="admin-card stat-card">
      <i class="fas fa-users"></i>
      <div>
        <h3>Total Users</h3>
        <p id="totalUsers">0</p>
      </div>
    </div>

    <div class="admin-card stat-card">
      <i class="fas fa-shopping-cart"></i>
      <div>
        <h3>Total Orders</h3>
        <p id="totalOrders">0</p>
      </div>
    </div>

    <div class="admin-card stat-card">
      <i class="fas fa-coins"></i>
      <div>
        <h3>Revenue</h3>
        <p id="revenue">R0.00</p>
      </div>
    </div>

  </div>

  <!-- Categories -->
  <div class="dashboard-panel">
    <h2>Books by Category</h2>
    <div id="categoryGrid" class="admin-grid"></div>
  </div>

  <!-- Dashboard Columns -->
  <div class="dashboard-columns">

    <div class="dashboard-panel">
      <h2>Low Stock Alerts</h2>
      <div id="stockAlerts"></div>
    </div>

    <div class="dashboard-panel">
      <h2>Recent Orders</h2>
      <div id="recentOrders"></div>
    </div>

  </div>

</section>

    <!-- Add Book Form -->
    <section class="auth-section">
      <div class="add-book-card">
        <h2 class="title-md">Add New Book</h2>
        <form class="add-book-form" id="addBookForm" enctype="multipart/form-data" >
          <div class="form-group">
            <label>ISBN</label>
            <input type="number" name="isbn" required>
          </div>
          <div class="form-group">
            <label>Author</label>
            <input type="text" name="author" required>
          </div>
          <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" required>
          </div>
          <div class="form-group">
            <label>Price</label>
            <input type="number" step="0.01" name="price" required>
          </div>
          <div class="form-group">
            <label>Stock Quantity</label>
            <input type="number" name="stockQuantity" required>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select name="category" required>
              <option value="">Select Category</option>
              <option value="thriller">Thriller</option>
              <option value="fiction">Fiction</option>
              <option value="romance">Romance</option>
              <option value="self help">Self Help</option>
              <option value="sport">Sport</option>
              <option value="booktok">BookTok</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea name="description" required></textarea>
          </div>
          <div class="form-group">
            <label>Book Image (PNG/JPG)</label>
            <input type="file" name="image" accept="image/*" required>
          </div>
          <button type="submit">Add Book</button>
        </form>
      </div>
    </section>
  </main>

  <footer id="footerplaceholder"></footer>
  <script src="script.js"></script>
</body>
</html>

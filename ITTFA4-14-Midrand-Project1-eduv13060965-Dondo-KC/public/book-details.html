<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Haven</title>
    <!--link to font awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
    <!--link to css-->
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <header id="headerplaceholder"></header>
    <main class="section">
           <!-- Book DetailsHeader -->
    <section class="section-header">
      <div class="container">
        <h1 class="section-title">Book Details</h1>
        <p class="text-muted">Learn more about this book and its features</p>
      </div>
    </section>
              
            <!--show the details of the selected book, including information about the author, description, and price -->
            <section class="book-details">
                <div class="container">
                    <div class="book-details-card" id="book-details">
                        <!-- The book details will be dynamically inserted here using JavaScript -->
                    </div>
                </div>
            </section>

            <!--Related Books-->
            <section class="section-header">
                <div class="container">
                    <h2 class="section-title">Related Books</h2>
                    <p class="text-muted">Explore similar books</p>
                </div>
            </section>
            
            <section class="related-books">
                <div class="container">
                    <div class="grid book-grid related-books-grid" id="related-books">
                        <!-- The related books will be dynamically inserted here using JavaScript -->
                    </div>
                </div>
            </section>
       
    </main>
        


<footer id="footerplaceholder"></footer>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Haven</title>
    <!--link to font awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
    <!--link to css-->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!--header-->
    <header id="headerplaceholder"></header>
 <div class="section">
  <div class="container">

    <div class="auth-card">

      <!-- Title -->
      <div class="section-header">
        <h1 class="section-title">Sign In to Book Haven</h1>
        <p class="section-desc">Access your account and continue exploring</p>
      </div>

      <!-- Form -->
      <form class="auth-form">

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label class="label" for="password">Password</label>
          <input class="input" type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full">
          Sign In
          <a href="index.html"></a>
        </button>

      </form>

      <!-- Divider -->
      <div class="divider">
        <span>or</span>
      </div>

      <!-- Login -->
      <div class="auth-footer">
        <p>
          Don't have an account?
          <a href="signUp.html">Sign up</a>
        </p>
      </div>

    </div>
  </div>
</div>

    <!--footer-->
    <footer  id="footerplaceholder"></footer>
    
<script src="script.js"></script>
</body>
</html>
